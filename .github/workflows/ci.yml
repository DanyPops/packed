name: CI

# Runs on every push/PR -- packed previously had no pre-merge CI at all,
# only publish.yml's tag-triggered per-package build+typecheck+test.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      # packages/packed's smoke-mode tests require a real bubblewrap + prlimit
      # sandbox (see src/adoption/smoke.ts) -- not present on GitHub-hosted runners by default.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap util-linux
      - run: bun install
      - run: bun run lint:ci
      - run: bun run typecheck
      - run: bun run test
