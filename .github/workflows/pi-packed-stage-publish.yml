name: Stage npm package

on:
  workflow_dispatch:
  push:
    tags:
      - "pi-packed-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: stage-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      # --ignore-scripts skips @danypops/packed's own build; its dist/
      # subpath exports (client.js, protocol.js) must exist before
      # pi-packed can typecheck/test against them.
      - run: bun run --cwd packages/packed build
      - name: Verify @danypops/packed@^0.1.0 is already published (core-first ordering)
        run: |
          version=$(node -p "require('./node_modules/@danypops/packed/package.json').version")
          npm view "@danypops/packed@$version" version
      - run: bun run --cwd packages/pi-packed typecheck
      - run: bun run --cwd packages/pi-packed test
      - run: bunx --bun @danypops/packed@latest check packages/pi-packed
      - run: npm install --global npm@11.15.0
      - run: npm --version
      - run: npm publish --access public --provenance --ignore-scripts
        working-directory: packages/pi-packed
