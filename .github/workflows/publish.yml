name: Publish Package

# Trusted publishing (OIDC): no long-lived npm tokens. npm CLI detects the
# OIDC environment automatically (requires npm >= 11.5.1). Both packages'
# npmjs.com Trusted Publisher configs point at this one repo (org=DanyPops
# repo=packed) and this exact workflow filename (publish.yml) -- one shared
# file dispatching by tag prefix matches what's configured, instead of
# reconfiguring npmjs.com per package.

on:
  push:
    tags:
      - "packed-v*"
      - "pi-packed-v*"

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish-packed:
    if: startsWith(github.ref, 'refs/tags/packed-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      # packages/packed's smoke-mode tests require a real bubblewrap + prlimit
      # sandbox (see src/adoption/smoke.ts) -- not present on GitHub-hosted runners by default.
      # A short per-step timeout plus apt's own retries fails fast and clearly on a slow/broken
      # mirror instead of silently consuming the whole job's budget with no indication of why.
      - name: Install sandbox test dependencies
        timeout-minutes: 5
        run: sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 && sudo apt-get install -y -o Acquire::Retries=3 bubblewrap util-linux

      - run: bun install
      - run: bun run lint:ci
      - run: bun run --cwd packages/packed build
      - run: bun run --cwd packages/packed typecheck
      - run: bun run --cwd packages/packed test

      # npm CLI only for the publish step (trusted publishing needs >= 11.5.1).
      # NO registry-url here: it makes setup-node write an .npmrc with an empty
      # NODE_AUTH_TOKEN line, which shadows OIDC auto-detection and breaks
      # trusted publishing with a 404.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; Node's bundled npm can be older.
      - run: npm install -g npm@latest && npm --version

      - run: npm publish --access public
        working-directory: packages/packed

  publish-pi-packed:
    if: startsWith(github.ref, 'refs/tags/pi-packed-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: stage-npm-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint:ci
      # --ignore-scripts skips @danypops/packed's own build; its dist/
      # subpath exports (client.js, protocol.js) must exist before
      # pi-packed can typecheck/test against them.
      - run: bun run --cwd packages/packed build
      - name: Verify @danypops/packed@^0.1.0 is already published (core-first ordering)
        run: |
          version=$(node -p "require('./node_modules/@danypops/packed/package.json').version")
          npm view "@danypops/packed@$version" version
      # pi-packed self-references its own subpath exports (@danypops/pi-packed/client,
      # @danypops/pi-packed/protocol) since the Pi-integration/core split -- its own
      # dist/ must exist before its typecheck can resolve them, same reason packed's
      # own build runs above.
      - run: bun run --cwd packages/pi-packed build
      - run: bun run --cwd packages/pi-packed typecheck
      - run: bun run --cwd packages/pi-packed test
      - run: bun run packages/pi-packed/service/src/cli/cli.ts check packages/pi-packed

      # Same as publish-packed: no registry-url on setup-node, it writes an
      # .npmrc with an empty NODE_AUTH_TOKEN line that shadows OIDC
      # auto-detection and breaks trusted publishing with a 404 -- confirmed
      # live, this is exactly what the first real run of this job hit.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - run: npm install -g npm@latest && npm --version

      - run: npm publish --access public --provenance --ignore-scripts
        working-directory: packages/pi-packed
