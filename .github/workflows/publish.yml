name: Publish Package

# Trusted publishing (OIDC): no long-lived npm tokens. npm CLI detects the
# OIDC environment automatically (requires npm >= 11.5.1). Configure the
# trusted publisher on npmjs.com: org=DanyPops repo=pi-packed workflow=publish.yml
#
# Targets packages/packed (the core package) on packed-v* tags -- distinct
# from pi-packed-v*, which pi-packed-stage-publish.yml already owns, so the
# two packages' tags can never race on the same trigger.

on:
  push:
    tags:
      - "packed-v*"

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bun install
      - run: bun run --cwd packages/packed build
      - run: bun run --cwd packages/packed typecheck
      - run: bun run --cwd packages/packed test

      # npm CLI only for the publish step (trusted publishing needs >= 11.5.1).
      # NO registry-url here: it makes setup-node write an .npmrc with an empty
      # NODE_AUTH_TOKEN line, which shadows OIDC auto-detection and breaks
      # trusted publishing with a 404.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; Node's bundled npm can be older.
      - run: npm install -g npm@latest && npm --version

      - run: npm publish --access public
        working-directory: packages/packed
